# apache/httpd.conf - hobby-os の kernel/vhost.c と同じサイト構成を、本物の Apache で作る
#
# 使い方(~/hobby-os で):
#   make apache-start    起動する(http://localhost:8081/ で開ける)
#   make apache-stop     止める
#   make apache-check    設定ファイルの書き間違いを調べる(apachectl configtest と同じ)
#   make compare-apache  同じリクエストを hobby-os と Apache に送って見比べる
#
# Ubuntu 標準の Apache(/etc/apache2/apache2.conf、sudo が要る)とは別に、
# 自分のユーザーで動かす。ポートが 1024 以上なら root でなくても受けられる。
# ${HOBBY_OS} は Makefile が渡すリポジトリの場所(~/hobby-os)。

# ---- サーバー全体の設定 ----

ServerRoot        ${HOBBY_OS}/apache
DefaultRuntimeDir ${HOBBY_OS}/build/apache
PidFile           ${HOBBY_OS}/build/apache/httpd.pid
ErrorLog          ${HOBBY_OS}/build/apache/error.log
LogLevel          warn

# 使う部品(モジュール)だけを読み込む。Ubuntu 標準の構成では /etc/apache2/mods-enabled/ に並ぶもの
#   mpm_event  : つながりをスレッドで受ける方式(Ubuntu の標準)
#   authz_core : Require(誰に見せるか)
#   dir        : DirectoryIndex("/" で index.html を返す)
#   mime       : 拡張子から Content-Type を決める
#   include    : SSI。HTML の中に Host ヘッダーなどを埋め込む(hobby-os の「その場で作るページ」の代わり)
LoadModule mpm_event_module  /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule dir_module        /usr/lib/apache2/modules/mod_dir.so
LoadModule mime_module       /usr/lib/apache2/modules/mod_mime.so
LoadModule include_module    /usr/lib/apache2/modules/mod_include.so

# 学習用なので小さく動かす(子プロセス1つ、スレッド少し)
StartServers      1
ServerLimit       1
ThreadsPerChild   8
MaxRequestWorkers 8
MinSpareThreads   1
MaxSpareThreads   8

# hobby-os は make run の転送で 127.0.0.1:8080 → 自作OSの 80。Apache は WSL の 127.0.0.1:8081 で受ける。
# Windows のブラウザからも http://localhost:8081/ で届く(WSL が localhost を転送する)
Listen 127.0.0.1:8081

# サーバー自身の名前(書かないと起動のたびに AH00558 の警告が出る)。サイトの振り分けには使わない
ServerName localhost

TypesConfig       /etc/mime.types
AddDefaultCharset utf-8
DirectoryIndex    index.html
KeepAlive         On

# アクセスログ。hobby-os の QEMU の画面のログと並べられる形にした
#   %a:%{remote}p 相手 / %r リクエスト行 / %{Host}i 届いた Host / %v 答えたサイトの ServerName / %>s 結果 / %B 本文
LogFormat "%a:%{remote}p \"%r\" %{Host}i -> %v %>s %BB" vhost
CustomLog ${HOBBY_OS}/build/apache/access.log vhost

# まず全部を見せない。サイトのフォルダだけ見せる
<Directory />
    Require all denied
    AllowOverride None
    Options None
</Directory>
<Directory ${HOBBY_OS}/apache/sites>
    Require all granted
</Directory>

# ---- サイトの一覧(順番に意味がある: 一番上が既定のサイト) ----
#
# hobby-os の vhosts[] との対応:
#   vhosts[0] _default_       → 下の1つ目(ServerName は .invalid で終わる「どこにもない名前」にした)
#   vhosts[1] localhost       → 2つ目
#   vhosts[2] blog.localhost  → 3つ目
#   vhosts[3] shop.localhost  → 4つ目
#   files[]                   → DocumentRoot のフォルダの中のファイル
#   respond_error の 404 ページ → ErrorDocument 404(どのサイトの 404 かを書く)

# サイト 0: 既定のサイト(どの名前にも当てはまらなかったとき)
<VirtualHost *:8081>
    ServerName    default.invalid
    DocumentRoot  ${HOBBY_OS}/apache/sites/default
    ErrorDocument 404 "<!doctype html><title>404</title><h1>404 Not Found</h1><p>Apache (default.invalid)</p>"
    <Directory ${HOBBY_OS}/apache/sites/default>
        Options +Includes
        AddOutputFilter INCLUDES .html
    </Directory>
</VirtualHost>

# サイト 1: localhost
<VirtualHost *:8081>
    ServerName    localhost
    ServerAlias   hobby-os.localhost
    DocumentRoot  ${HOBBY_OS}/apache/sites/localhost
    ErrorDocument 404 "<!doctype html><title>404</title><h1>404 Not Found</h1><p>Apache (localhost)</p>"
    <Directory ${HOBBY_OS}/apache/sites/localhost>
        Options +Includes
        AddOutputFilter INCLUDES .html
    </Directory>
</VirtualHost>

# サイト 2: blog.localhost
<VirtualHost *:8081>
    ServerName    blog.localhost
    ServerAlias   www.blog.localhost
    DocumentRoot  ${HOBBY_OS}/apache/sites/blog
    ErrorDocument 404 "<!doctype html><title>404</title><h1>404 Not Found</h1><p>Apache (blog.localhost)</p>"
</VirtualHost>

# サイト 3: shop.localhost
<VirtualHost *:8081>
    ServerName    shop.localhost
    DocumentRoot  ${HOBBY_OS}/apache/sites/shop
    ErrorDocument 404 "<!doctype html><title>404</title><h1>404 Not Found</h1><p>Apache (shop.localhost)</p>"
</VirtualHost>
